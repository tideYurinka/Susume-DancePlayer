name: dance_learning_app
description: "Susume — 舞蹈跟练 App：参考视频导入与标注、分段循环练习、对比跟练与练习统计。"
publish_to: 'none'
repository: https://github.com/tideYurinka/Susume-DancePlayer
issue_tracker: https://github.com/tideYurinka/Susume-DancePlayer/issues

version: 0.2.1+8

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # 播放内核（ADR-0001）：mpv 内核，帧级 seek（hr-seek）、任意倍速
  media_kit: ^1.2.0
  # Android 优先：media_kit 原生库（libmpv），真机冒烟所需
  media_kit_libs_android_video: ^1.2.0
  # 状态管理
  flutter_riverpod: ^3.0.0
  # ProviderListenable 取值面类型（手势演练输入值对象用；与 flutter_riverpod 同版本线）
  riverpod: ^3.4.2
  file_picker: ^12.1.2
  path_provider: ^2.1.6
  path: ^1.9.0
  media_kit_video: ^2.0.1
  screen_brightness: ^2.1.11
  device_info_plus: ^13.2.0
  # 节拍识别：一次性解码单声道 PCM；封面取帧也走它（滤镜 + 静态图输出）；
  # 投屏渲染（#26）同样走它——装配 ffmpeg 命令行、异步执行 + 进度 + 取消。
  # 「min 变体只缺 libx264 与 AAC」那句是错的：min 缺的是**外部**库
  # （libx264 这类 GPL 编解码器、mp3/opus 一类），而 H.264 硬编
  # （h264_mediacodec）与原生 AAC 都是 FFmpeg 核心自带、min 里就有——
  # 投屏渲染因此零新依赖、零体积增长（ADR-0004）。
  ffmpeg_kit_flutter_new_min: ^3.6.2
  # 节拍识别：纯 RNN ONNX 推理（前处理/DBN 解码在 Dart 侧）
  flutter_onnxruntime: ^1.8.4
  # 节拍识别：DBN Viterbi 热循环原生实现经 dart:ffi 调用（Android NDK 编译）
  ffi: ^2.1.0
  # 相机采集：前置摄像头预览与权限系统流程
  camera: ^0.11.0+2
  # 永久拒绝后跳系统设置页（非权限框架，仅打开设置）；9.x 起插件 compileSdk 36，
  # 5.x 硬编码 compileSdk 33 与 androidx 34+ 依赖不兼容，Android 构建阻断
  app_settings: ^9.0.0
  # susume 包：纯 Dart zip 库；条目恒 STORED（分块流式），
  # 包内大媒体不进 Dart 堆
  archive: ^4.2.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  # 帮助内容文件化：引导文案随包存于 assets/help/onboarding.yaml，装载模块读它
  yaml: ^3.1.3
  # 帮助文档正文渲染：官方 flutter_markdown 已停止维护，改用
  # replacedBy 指向的 flutter_markdown_plus；markdown 与它同源，装载时用
  # 同一份解析器取一级标题与图片引用。
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  # 关于页的版本号：从构建产物读，与 pubspec 的 version 同一来源，
  # 不在 Dart 里另抄一份字面量。
  package_info_plus: ^10.2.1
  # 帮助正文的外部网址：交系统浏览器打开；唯一引用点是
  # lib/help/platform_help_actions.dart。
  url_launcher: ^6.3.2
  # 帮助正文的图片保存：长按存进系统相册，含 Android 10 以下
  # WRITE_EXTERNAL_STORAGE 的权限查询与申请；唯一引用点是
  # lib/help/platform_help_actions.dart，平台没有实现时按同一句「保存失败」
  # 收场，不另写平台分支。
  gal: ^2.3.3
  # 投屏：DLNA/UPnP 的设备描述与 SOAP 报文的解析（`lib/cast/`）。它不是新包
  # ——本来就在 lockfile 里（原先只作测试解析 AndroidManifest 的 dev 依赖），
  # 投屏把它提升为运行时依赖：这两份 XML 是外部设备给的输入，手写解析是另一
  # 类风险，而它是纯 Dart、无原生码、不增 ABI 体积。
  xml: ^7.0.1
  # 投屏期屏幕常亮（#39）：不是新包——media_kit_video 的画面件就是经它持唤醒
  # 的（它本来就在 lockfile 里，是 media_kit_video 的传递依赖）。提升为直接
  # 依赖的理由：投屏态的画面区换成投屏覆盖件、连源画面件都不挂，唤醒没有持有
  # 者，得由投屏侧自己持；唯一引用点是
  # `lib/cast/wakelock_cast_screen_awake.dart`——与画面件同一条平台能力。
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # FakeEngine 单元测试的 fake 时钟（与 flutter_test 锁定的版本一致）
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 默认 flavor：三份安装身份（ADR-0003）里，不带 `--flavor` 的命令（`flutter
  # run`、`flutter build apk`）落在**正式版**；测试版必须显式 `--flavor beta`。
  # 没有这一行时 AGP 9 会把两个 flavor 的 release 变体都构建一遍，再以「找不到
  # app-release.apk」收场——出错方式与原因毫无关联。
  default-flavor: prod
  # 节拍识别模型资产随包（离线可用）：纯 RNN ONNX 模型 + filterbank 常量；
  # APK 增长估 +10–18MB/ABI（单 arm64 分发）。
  assets:
    - assets/models/
    # 节拍声内置音源的段资产：强拍 / 整拍 / 半拍三个采样，由音源注册表装配成
    # 速度组的 9 段；发声走原生常驻低延迟流。
    - assets/sounds/
    # 帮助域内容资产：`assets/help/` 直接含有 `onboarding.yaml` 这份引导文案。
    - assets/help/
    # 条目子目录逐行登记：目录条目不递归，新增一条目录必须在这里补一行，
    # 热重载才会带上。
    - assets/help/guide/00-Susume使用概览/
    - assets/help/guide/01-快捷手势/
    - assets/help/guide/02-控制界面概述/
    - assets/help/guide/03-节拍/
    - assets/help/guide/04-分段/
    - assets/help/guide/05-备注与镜像/
    - assets/help/guide/06-对比练习/
    - assets/help/guide/07-统计/
    - assets/help/guide/08-计划/
    - assets/help/guide/09-分享与备份/
    - assets/help/tutorials/01-下载视频/
    - assets/help/tutorials/02-免费视频变清晰/
    - assets/help/tutorials/03-问题反馈/
    - assets/help/tutorials/04-已知的问题/
    # 关于页内容：`assets/about/` 直接含有贡献者名单 `contributors.yaml`，每位
    # 贡献者一个以其 id 命名的目录；目录条目不递归，新增一位必须在这里补一行。
    - assets/about/
    - assets/about/yurinka/
    # 应用图标：关于页顶部的应用信息卡用。
    - assets/brand/
