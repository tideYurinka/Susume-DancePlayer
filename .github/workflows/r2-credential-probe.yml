# R2 凭据体检（release-and-update 票 04）。
#
# 按需手动触发，用与正式发布完全同一条上传路径真做一次「写入 → 从公开域名
# 回读 → 删除」。它独立于发布流水线：正式发布不依赖它，它也不上传、不修改
# 任何发布产物（只写 probe/ 下带本次 run 号的探针对象，并在结束时删掉）。
name: r2-credential-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: R2 凭据体检
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PUBLIC_ORIGIN: https://dl.yurinka.top
      PROBE_KEY: probe/${{ github.run_id }}-${{ github.run_attempt }}.txt

    steps:
      - name: 取源码
        uses: actions/checkout@v7

      - name: 体检：写入、公开回读、删除
        run: bash tool/r2_probe.sh
